name: Sync public Naver bookshop posts and publish Pages

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/sync-naver.yml'

permissions: {}
concurrency:
  group: bookjigi-production-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.stage.outputs.publish }}
    steps:
      # Always use current main, including changes pushed while a run was queued.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public-only import and non-destructive rendering
        run: node --test scripts/sync-naver.test.mjs
      - name: Sync public records (pushes publish existing docs independently of Naver)
        if: github.event_name != 'push'
        run: node scripts/sync-naver.mjs
      - name: Commit only validated archive files; never force-push
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            git add -- content/bookshop-archive.json src/pages/bookshop.html src/pages/bookshop-intro.html src/pages/bookshop-journal.html docs/bookshop/index.html docs/bookshop/intro/index.html docs/bookshop/journal/index.html docs/static/naver-sync-status.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Sync public Naver bookshop archive'
              git push origin HEAD:main
              publish=true
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Package this exact docs tree (no full-site build)
        if: steps.stage.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the prepared artifact, including bot-committed updates
        id: deployment
        uses: actions/deploy-pages@v4
